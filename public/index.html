<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Architektur, Abhängigkeiten und Projektgesundheit eines Code-Repositorys auf einen Blick."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23a77bff%22/%3E%3Cstop offset=%221%22 stop-color=%22%23ff6fc4%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22url(%23g)%22/%3E%3Cg fill=%22none%22 stroke=%22white%22 stroke-width=%221.3%22%3E%3Crect x=%222.5%22 y=%223%22 width=%224%22 height=%223%22 rx=%221%22/%3E%3Crect x=%229.5%22 y=%223%22 width=%224%22 height=%223%22 rx=%221%22/%3E%3Crect x=%226%22 y=%2210%22 width=%224%22 height=%223%22 rx=%221%22/%3E%3Cpath d=%22M4.5 6v2h7V6M8 8v2%22/%3E%3C/g%3E%3C/svg%3E"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>Repo Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Projekt-Canvas – schmale Kopfleiste mit Brotkrumen & Tabs, darunter eine gerahmte Arbeitsfläche mit Punktraster,
   Komponenten als Service-Karten mit fließenden Verbindungen, schwebende HUD-Elemente und ein Detail-Panel, das von rechts einfedert. */
:root{
  --bg:#0b0a10; --canvas:#100e17; --dot:rgba(255,255,255,.075);
  --surface:#16131f; --surface-2:#1c1927; --raised:#211d2e; --hover:#26213a;
  --border:rgba(255,255,255,.075); --border-2:rgba(255,255,255,.14);
  --text:#efecf7; --text-2:#a29cb6; --text-3:#6e6885;
  --accent:#a77bff; --accent-2:#ff6fc4; --accent-ink:#ffffff; --accent-soft:rgba(167,123,255,.15); --ring:rgba(167,123,255,.45);
  --edge:rgba(196,186,230,.22); --edge-hot:#b892ff;
  --ok:#3ddc97; --warn:#f5b84b; --bad:#ff6b6b;
  --c-frontend:#5aa9ff; --c-backend:#3ddc97; --c-core:#b18cff; --c-infra:#ff9f5a;
  --c-tests:#f2cf4a; --c-docs:#a9a4b8; --c-tooling:#ff7ac6; --c-config:#8592ff;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.25);
  --shadow-lg:0 1px 0 rgba(255,255,255,.05) inset,0 30px 60px -20px rgba(0,0,0,.7),0 8px 20px rgba(0,0,0,.35);
  --glass:rgba(22,19,31,.72);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5f4f9; --canvas:#fbfaff; --dot:rgba(30,15,70,.1);
  --surface:#ffffff; --surface-2:#f7f6fb; --raised:#ffffff; --hover:#f1eefa;
  --border:rgba(30,18,60,.09); --border-2:rgba(30,18,60,.17);
  --text:#16131f; --text-2:#5c566d; --text-3:#928ca3;
  --accent:#7c3aed; --accent-2:#db2777; --accent-ink:#ffffff; --accent-soft:rgba(124,58,237,.1); --ring:rgba(124,58,237,.35);
  --edge:rgba(70,50,120,.22); --edge-hot:#7c3aed;
  --ok:#10a36a; --warn:#c48300; --bad:#e5484d;
  --c-frontend:#2878e6; --c-backend:#10a36a; --c-core:#7c3aed; --c-infra:#e4691b;
  --c-tests:#b58a00; --c-docs:#77728a; --c-tooling:#d6338a; --c-config:#4b5bd8;
  --shadow:0 1px 2px rgba(30,15,60,.06),0 8px 24px -12px rgba(30,15,60,.18);
  --shadow-lg:0 2px 6px rgba(30,15,60,.06),0 30px 60px -24px rgba(30,15,60,.3);
  --glass:rgba(255,255,255,.78);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f5f4f9; --canvas:#fbfaff; --dot:rgba(30,15,70,.1);
  --surface:#ffffff; --surface-2:#f7f6fb; --raised:#ffffff; --hover:#f1eefa;
  --border:rgba(30,18,60,.09); --border-2:rgba(30,18,60,.17);
  --text:#16131f; --text-2:#5c566d; --text-3:#928ca3;
  --accent:#7c3aed; --accent-2:#db2777; --accent-ink:#ffffff; --accent-soft:rgba(124,58,237,.1); --ring:rgba(124,58,237,.35);
  --edge:rgba(70,50,120,.22); --edge-hot:#7c3aed;
  --ok:#10a36a; --warn:#c48300; --bad:#e5484d;
  --c-frontend:#2878e6; --c-backend:#10a36a; --c-core:#7c3aed; --c-infra:#e4691b;
  --c-tests:#b58a00; --c-docs:#77728a; --c-tooling:#d6338a; --c-config:#4b5bd8;
  --shadow:0 1px 2px rgba(30,15,60,.06),0 8px 24px -12px rgba(30,15,60,.18);
  --shadow-lg:0 2px 6px rgba(30,15,60,.06),0 30px 60px -24px rgba(30,15,60,.3);
  --glass:rgba(255,255,255,.78);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{font-family:var(--font);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 14px}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline;text-underline-offset:2px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);min-height:520px}

/* ===== Kopfleiste ===== */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px 0}
.crumbs{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 280px}
.mark{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:conic-gradient(from 210deg,var(--accent),var(--accent-2),var(--accent));box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 6px 18px -6px var(--accent)}
.mark svg{width:16px;height:16px}
.crumbs .sep{color:var(--text-3);font-size:18px;font-weight:300}
.crumbs .app-name{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.crumbs .proj{font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.env{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);border:1px solid var(--border);background:var(--surface);padding:2px 9px 2px 7px;border-radius:99px;white-space:nowrap}
.env i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.tag-example{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:2px 7px;border-radius:5px;white-space:nowrap}

.actions{display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.cmd{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 11px;min-width:0;width:340px;max-width:100%;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;transition:border-color .2s,box-shadow .2s}
.cmd:focus-within{border-color:var(--ring);box-shadow:0 0 0 4px var(--accent-soft)}
.cmd svg{width:15px;height:15px;color:var(--text-3);flex:none}
.cmd input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px}
.cmd input::placeholder{color:var(--text-3)}
kbd{font-family:var(--font);font-size:11px;color:var(--text-3);border:1px solid var(--border-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:17px}
.btn{position:relative;height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:7px;
  font-weight:500;font-size:13px;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s,transform .1s ease-out,box-shadow .2s}
.btn:hover{background:var(--hover);border-color:var(--border-2)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn.primary{border:0;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent-2)));
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 8px 22px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.busy::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabs{position:relative;display:flex;gap:2px;flex-basis:100%;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:none;padding:10px 12px 12px;color:var(--text-2);font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:color .15s}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text)}
.tab svg{width:15px;height:15px;opacity:.85}
.tab .count{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.tab-ind{position:absolute;bottom:-1px;left:0;height:2px;width:0;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));will-change:transform,width}

/* Token-Popover */
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:300px;padding:12px;border-radius:var(--r);background:var(--raised);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);
  transform-origin:top right;transition:opacity .18s var(--out),transform .22s var(--out)}
.pop[data-open="false"]{opacity:0;transform:scale(.96) translateY(-4px);pointer-events:none;visibility:hidden}
.pop label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
.pop input{width:100%;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);padding:0 10px;font-family:var(--mono);font-size:12px;outline:none}
.pop input:focus{border-color:var(--ring)}
.pop p{margin:8px 0 0;font-size:11.5px;color:var(--text-3)}
.anchor{position:relative}

/* ===== Arbeitsfläche ===== */
.workspace{position:relative;margin-top:14px;min-height:0;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--canvas);box-shadow:var(--shadow)}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
.view.enter{animation:viewIn .35s var(--out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.stage{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px);background-size:22px 22px}
.stage.dragging{cursor:grabbing}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible}
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-2);text-align:center;padding:24px}

/* Gruppen */
.grp{position:absolute;border:1px dashed var(--border-2);border-radius:18px;background:color-mix(in srgb,var(--surface) 35%,transparent);pointer-events:none;transition:opacity .25s}
.grp span{position:absolute;top:10px;left:14px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}

/* Service-Karten */
.card{position:absolute;width:232px;padding:12px 13px 11px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  cursor:pointer;user-select:none;transition:border-color .2s,box-shadow .25s,opacity .25s,transform .2s var(--out)}
.card:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card:active{transform:translateY(-1px) scale(.985)}
.card .hd{display:flex;align-items:center;gap:10px;min-width:0}
.card .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 28%,transparent) inset}
.card .ico svg{width:16px;height:16px}
.card .nm{font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.card .pth{font-family:var(--mono);font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ft{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-size:12px;color:var(--text-2)}
.card .ft .dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.card .ft .sz{margin-left:auto;color:var(--text-3);font-variant-numeric:tabular-nums}
.card.sel{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent),var(--shadow-lg)}
.card.dim,.grp.dim{opacity:.32}
.card.ext .pth{font-family:var(--font);font-style:italic}

/* Kanten */
.edge{fill:none;stroke:var(--edge);stroke-linecap:round;transition:stroke .25s,opacity .25s}
.flow{fill:none;stroke:var(--edge-hot);stroke-linecap:round;stroke-dasharray:3 11;opacity:.35;animation:flow 1.1s linear infinite;transition:opacity .25s}
.edge.hot{stroke:var(--edge-hot)}
.flow.hot{opacity:1}
.edge.dim,.flow.dim{opacity:.12}
@keyframes flow{to{stroke-dashoffset:-14}}
.elabel{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:0 6px;line-height:16px;white-space:nowrap;pointer-events:none;transition:opacity .25s,color .25s,border-color .25s}
.elabel.hot{color:var(--edge-hot);border-color:color-mix(in srgb,var(--edge-hot) 50%,transparent)}
.elabel.dim{opacity:.15}

/* HUD */
.hud{position:absolute;left:14px;right:14px;top:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.floating{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.summary{padding:12px 14px;max-width:420px;min-width:0}
.summary .eyebrow{font-size:11px;color:var(--text-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.summary h1{margin:3px 0 2px;font-size:17px;font-weight:700;letter-spacing:-.022em;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.summary h1 a{color:inherit}
.summary p{margin:0;color:var(--text-2);font-size:12.5px}
.kpis{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.kpi b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--text-3)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:6px}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border)}
.seg button{position:relative;z-index:1;border:0;background:none;height:24px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:color .15s}
.seg button[aria-pressed="true"]{color:var(--text)}
.seg button:disabled{color:var(--text-3);cursor:not-allowed}
.seg button svg{width:13px;height:13px}
.seg .knob{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:6px;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.25),0 0 0 1px var(--border-2) inset;will-change:transform,width}
.overview{max-width:520px;padding:12px 14px;margin-top:0;font-size:13px;border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.overview .who{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.overview p{margin:0}
.leftcol{display:flex;flex-direction:column;gap:10px;min-width:0;max-width:min(520px,100%)}

.zoom{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;padding:3px;z-index:5}
.zoom button{width:30px;height:30px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--text-2);display:grid;place-items:center;transition:background-color .15s,color .15s}
.zoom button:hover{background:var(--hover);color:var(--text)}
.zoom button:active{transform:scale(.94)}
.zoom button svg{width:15px;height:15px}
.zoom hr{border:0;height:1px;background:var(--border);margin:2px 4px}
.legend{position:absolute;left:60px;right:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none;z-index:4}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);padding:4px 9px;border-radius:99px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--border)}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* ===== Detail-Panel ===== */
.panel{position:absolute;top:10px;right:10px;bottom:10px;width:380px;max-width:calc(100% - 20px);z-index:20;display:flex;flex-direction:column;
  background:var(--raised);border:1px solid var(--border-2);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);transform:translateX(calc(100% + 24px));will-change:transform}
.panel[data-state="closed"]{visibility:hidden}
.panel .grab{position:absolute;left:0;top:0;bottom:0;width:14px;cursor:ew-resize;touch-action:none}
.panel .ph{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--border);cursor:grab;touch-action:none}
.panel .ph:active{cursor:grabbing}
.panel .ph .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent) inset}
.panel .ph .ico svg{width:19px;height:19px}
.panel .ph h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.25;overflow-wrap:anywhere}
.panel .ph .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pill{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.panel .pb{flex:1;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:16px}
.panel .pb>*{animation:rise .4s var(--out) both}
.panel .pb>*:nth-child(2){animation-delay:.03s}.panel .pb>*:nth-child(3){animation-delay:.06s}.panel .pb>*:nth-child(4){animation-delay:.09s}.panel .pb>*:nth-child(5){animation-delay:.12s}.panel .pb>*:nth-child(6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec h4{margin:0 0 7px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:9px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
.tile b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--text-3)}
.desc{margin:0;color:var(--text-2);font-size:13px}
.pathbox{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.pathbox svg{width:14px;height:14px;flex:none;color:var(--text-3)}
.minibar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin-bottom:7px}
.minibar i{height:100%}
.rows{display:flex;flex-direction:column}
.rows .r{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:0 -8px;border-radius:8px;font-size:12.5px;min-width:0}
.rows .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rows .r .v{margin-left:auto;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none}
.rows .r .d{width:7px;height:7px;border-radius:50%;flex:none}
.rows button.r{border:0;background:none;text-align:left;cursor:pointer;width:calc(100% + 16px);transition:background-color .15s}
.rows button.r:hover{background:var(--hover)}
.rows button.r .ar{color:var(--text-3);transition:transform .2s var(--out)}
.rows button.r:hover .ar{transform:translateX(3px);color:var(--accent)}
.rows .r.f{font-family:var(--mono);font-size:11.5px}
.empty-note{font-size:12.5px;color:var(--text-3)}
.close{width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--text-2);cursor:pointer;display:grid;place-items:center;flex:none;transition:background-color .15s}
.close:hover{background:var(--hover);color:var(--text)}
.close svg{width:15px;height:15px}

/* ===== Treemap ===== */
.subbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.subbar .sp{flex:1}
.hint{font-size:12px;color:var(--text-3)}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}
.crumb button{border:0;background:none;color:var(--text-2);cursor:pointer;padding:3px 8px;border-radius:7px;transition:background-color .15s}
.crumb button:hover{background:var(--hover);color:var(--text)}
.crumb button:last-child{color:var(--text);background:var(--surface-2);box-shadow:0 0 0 1px var(--border) inset;font-weight:500}
.crumb .s{color:var(--text-3)}
.tm{position:relative;flex:1;min-height:0;margin:10px}
.tm .t{position:absolute;overflow:hidden;font-size:10.5px;line-height:1.25;padding:3px 6px;border-radius:4px;font-family:var(--font);transition:filter .15s}
.tm .t.dir{background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--text-3);font-weight:600;cursor:zoom-in;box-shadow:0 0 0 1px var(--border) inset;letter-spacing:.01em}
.tm .t.dir:hover{color:var(--text);box-shadow:0 0 0 1px var(--border-2) inset}
.tm .t.leaf{cursor:pointer}
.tm .t.leaf:hover{filter:brightness(1.15);z-index:2}
.tip{position:fixed;z-index:60;pointer-events:none;max-width:360px;padding:7px 10px;border-radius:9px;font-family:var(--mono);font-size:11.5px;white-space:pre;
  background:var(--raised);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);color:var(--text)}

/* ===== Dateien ===== */
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);flex:1 1 240px;max-width:420px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--ring);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{width:14px;height:14px;color:var(--text-3)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:12.5px}
.files{flex:1;overflow:auto;padding:8px;font-size:12.5px}
.files .r{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:7px;white-space:nowrap;transition:background-color .12s}
.files .r:hover{background:var(--hover)}
.files .r.d{cursor:pointer}
.files .r .tw{width:12px;flex:none;color:var(--text-3);display:inline-block;transition:transform .2s var(--out)}
.files .r .tw.open{transform:rotate(90deg)}
.files .r svg{width:14px;height:14px;flex:none;color:var(--text-3)}
.files .r .nm{overflow:hidden;text-overflow:ellipsis}
.files .r .ct{font-size:11px;color:var(--text-3)}
.files .r .tst{font-size:10.5px;color:var(--c-tests);background:color-mix(in srgb,var(--c-tests) 14%,transparent);padding:0 6px;border-radius:4px}
.files .r .sz{margin-left:auto;padding-left:14px;color:var(--text-3);font-variant-numeric:tabular-nums}
.files .r .ld{width:7px;height:7px;border-radius:50%;flex:none}

/* ===== Screening ===== */
.health{flex:1;overflow:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;max-width:1280px;margin:0 auto}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow);animation:rise .5s var(--out) both}
.box h3{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);display:flex;justify-content:space-between;gap:8px}
.box h3 small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--text-3)}
.span4{grid-column:span 4}.span5{grid-column:span 5}.span7{grid-column:span 7}.span8{grid-column:span 8}.span6{grid-column:span 6}.span12{grid-column:span 12}
.scorebox{display:flex;align-items:center;gap:18px}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:url(#ringGrad);stroke-linecap:round}
.scorebox .big{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.scorebox .big small{font-size:15px;color:var(--text-3);font-weight:500;letter-spacing:0}
.scorebox p{margin:6px 0 0;color:var(--text-2);font-size:12.5px}
.counts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.counts span{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:500}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:1px 10px;padding:8px 0;border-bottom:1px solid var(--border)}
.checks .st{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700}
.checks .ok .st{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.checks .warn .st{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.checks .bad .st{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.checks .na .st{color:var(--text-3);background:var(--surface-2)}
.checks b{font-weight:600;font-size:13px}
.checks .why{grid-column:2;font-size:12px;color:var(--text-2);overflow-wrap:anywhere}
.langbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin-bottom:12px;gap:2px}
.langbar i{height:100%;border-radius:2px;transform-origin:left;animation:grow .8s var(--out) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.notice{font-size:12.5px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}

/* ===== Analyse-Log ===== */
.log{position:absolute;right:14px;bottom:14px;z-index:30;width:min(380px,calc(100% - 28px));border-radius:var(--r);background:var(--raised);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);overflow:hidden;
  transform-origin:bottom right;transition:opacity .25s var(--out),transform .35s var(--out)}
.log[data-open="false"]{opacity:0;transform:translateY(12px) scale(.97);pointer-events:none;visibility:hidden}
.log .lh{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600;font-size:12.5px}
.log .lh .st{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--ring);animation:pulse 1.4s ease-out infinite}
.log .lh .st.ok{background:var(--ok);animation:none}.log .lh .st.err{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ring)}100%{box-shadow:0 0 0 9px transparent}}
.log .lh .sp{flex:1}
.log .lb{padding:8px 12px 10px;font-family:var(--mono);font-size:11.5px;display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto;background:var(--surface-2)}
.log .row{display:flex;gap:9px;animation:rise .3s var(--out) both}
.log .row i{font-style:normal;width:12px;flex:none;color:var(--accent)}
.log .row.done{color:var(--text-2)} .log .row.done i{color:var(--ok)}
.log .row.err{color:var(--bad)} .log .row.err i{color:var(--bad)}

/* ===== Responsiv ===== */
@media (max-width:900px){.span4,.span5,.span7,.span8,.span6{grid-column:span 12}.checks{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){
  .crumbs .app-name,.crumbs .sep.first{display:none}
  .actions{flex:1 1 100%;justify-content:stretch}
  .cmd{flex:1 1 100%;width:auto}
  .summary p,.kpis .opt{display:none}
  .legend{display:none}
  .panel{top:auto;left:10px;width:auto;max-width:none;height:72%}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}.flow{display:none}}
@media (prefers-reduced-transparency:reduce){.floating,.legend span{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){.card,.box,.floating,.panel{border-color:var(--text-2)}}
</style>

<div class="app">
  <header class="top">
    <div class="crumbs">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><g fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><rect x="1.8" y="2" width="5" height="4" rx="1.3"/><rect x="9.2" y="2" width="5" height="4" rx="1.3"/><rect x="5.5" y="10" width="5" height="4" rx="1.3"/><path d="M4.3 6v2h7.4V6M8 8v2"/></g></svg></span>
      <span class="app-name">Repo Screener</span>
      <span class="sep first">/</span>
      <span class="proj" id="repoName">–</span>
      <span class="env" id="envPill"><i></i><span id="envTxt">main</span></span>
    </div>
    <div class="actions">
      <form class="cmd" id="loadForm" autocomplete="off">
        <svg><use href="#i-search"/></svg>
        <input id="repoInput" placeholder="GitHub-Repo analysieren, z. B. vercel/next.js" spellcheck="false" aria-label="GitHub-Repository">
        <kbd id="kbdHint">/</kbd>
      </form>
      <button class="btn primary" type="submit" form="loadForm" id="loadBtn">Analysieren</button>
      <div class="anchor">
        <button class="btn icon" type="button" id="tokenBtn" aria-label="GitHub-Token für private Repos" aria-expanded="false"><svg><use href="#i-key"/></svg></button>
        <div class="pop" id="tokenPop" data-open="false">
          <label for="tokenInput">GitHub-Token für private Repos</label>
          <input id="tokenInput" type="password" placeholder="ghp_…" autocomplete="off">
          <p>Bleibt nur im Arbeitsspeicher dieses Tabs.</p>
        </div>
      </div>
      <label class="btn" for="dirInput" title="Lokalen Projektordner analysieren – Dateien verlassen den Browser nicht"><svg><use href="#i-folder"/></svg>Ordner</label>
      <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
      <button class="btn" type="button" id="sampleBtn">Beispiel</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Ansicht">
      <button class="tab" role="tab" aria-selected="true" data-tab="arch" id="tab-arch"><svg><use href="#i-arch"/></svg>Architektur <span class="count" id="bArch"></span></button>

  </header>

  <main class="workspace" id="workspace">
    <section class="view" data-view="arch">
      <div class="stage" id="stage">
        <div class="canvas" id="canvas"><svg id="edges"></svg><div id="nodes"></div></div>

      </div>
      <div class="hud">
        <div class="leftcol">
          <div class="summary floating" id="summary">
            <div class="eyebrow" id="srcLabel">Quelle</div>

            <p id="repoDesc"></p>
            <div class="kpis" id="kpis"></div>
          </div>
          <div class="overview floating" id="overview" hidden></div>
        </div>
        <div class="controls floating">
          <div class="seg" role="group" aria-label="Richtung" id="segDir"><span class="knob"></span>
            <button type="button" id="dirTD" aria-pressed="true" aria-label="Von oben nach unten"><svg><use href="#i-down"/></svg></button>
            <button type="button" id="dirLR" aria-pressed="false" aria-label="Von links nach rechts"><svg><use href="#i-right"/></svg></button>
          </div>
          <button class="btn sm icon" type="button" id="copyMm" title="Mermaid-Quelltext kopieren" aria-label="Mermaid-Quelltext kopieren"><svg><use href="#i-copy"/></svg></button>
        </div>
      </div>

e.\n- **Explore the architecture** with an AI-generated diagram and streamed explanation.\n- **Jump to the code** by clicking any component's linked file or directory.\n- **Use private repositories** with a GitHub token via **Private Repos** in the header.\n- **Export diagrams** as PNG or copy the Mermaid source.\n\n## Use GitDiagram from AI agents\n\nGitDiagram is a remote MCP server at `https://gitdiagram.com/mcp` (no key or sign-in). Agents can read a public rep","deps":["@aws-sdk/client-s3","@aws-sdk/s3-request-presigner","@modelcontextprotocol/ext-apps","@modelcontextprotocol/server","@radix-ui/react-dialog","@radix-ui/react-switch","@radix-ui/react-tooltip","@smithy/fetch-http-handler","clsx","dompurify","ffmpeg-static","geist","lucide-react","mermaid","next","next-themes","openai","posthog-js","puppeteer-core","react","react-dom","resend","server-only","sonner","stripe","tailwind-merge","zod","@cloudflare/containers","@modelcontextprotocol/client","@opennextjs/cloudflare","@tailwindcss/postcss","@testing-library/jest-dom","@testing-library/react","@types/jsdom","@types/node","@types/react","@types/react-dom","esbuild","eslint","eslint-config-next","jsdom","knip","postcss","prettier","prettier-plugin-tailwindcss","redis","tailwindcss","typescript","typescript-7","vitest","wrangler"]}</script>

/* ============ Kategorien (Architektur-Schichten) ============ */
const CATS = {
  frontend:{label:"Frontend / UI", rx:/^(app|pages|components?|ui|views?|screens?|hooks|styles?|public|static|assets|frontend|web|client|features|layouts?|templates|widgets|www|site|mcp-app)$/i},

  config:{label:"Projektwurzel / Konfiguration", rx:/^$/},
};
const CAT_ORDER = ["frontend","backend","core","infra","tooling","tests","docs","config"];
function categorize(compPath, hint) {
  if (compPath === "") return "config";
  const segs = compPath.split("/");
  for (let i = segs.length - 1; i >= 0; i--) {
    for (const c of CAT_ORDER) if (c !== "config" && CATS[c].rx.test(segs[i])) {
      if (c === "core" && i < segs.length - 1) continue; /* "src/…": nicht pauschal Kern */
      return c;
    }
  }
  if (hint) { const h = hint.toLowerCase();
    if (/front|ui|client|web|view|komponent/.test(h)) return "frontend";
    if (/back|api|server|worker|dienst|service/.test(h)) return "backend";
    if (/infra|deploy|ci|build|cloud|devops/.test(h)) return "infra";
    if (/test/.test(h)) return "tests"; if (/doc/.test(h)) return "docs";
    if (/tool|experiment|plugin|skript/.test(h)) return "tooling";
    if (/daten|data|kern|core|lib|model|store|shared|util/.test(h)) return "core";

const JS_IMPORT_RX = /(?:import\s[^'"]*?from\s*|import\s*\(\s*|require\(\s*|export\s[^'"]*?from\s*|^import\s+)['"]([^'"]+)['"]/gm;
const PY_IMPORT_RX = /^\s*(?:from\s+(\.*[\w.]*)\s+import|import\s+([\w.]+(?:\s*,\s*[\w.]+)*))/gm;
function extractImports(path, text) {
  const out = new Set();

  if (o) setTimeout(() => $("#tokenInput").focus(), 30);
}
$("#tokenBtn").onclick = e => { e.stopPropagation(); toggleToken(); };
document.addEventListener("pointerdown", e => { if (!e.target.closest(".anchor") && $("#tokenPop").dataset.open === "true") toggleToken(false); });

/* ============ Analyse-Protokoll (Build-Log) & Toasts ============ */
let logHide = 0;
function logStart(title = "Analyse läuft") {
  clearTimeout(logHide);
  const l = $("#log"); l.dataset.open = "true"; $("#logBody").textContent = ""; $("#logTitle").textContent = title; $("#logSt").className = "st";
}
function logStep(text, cls = "") { const r = el("div", { class: "row " + cls }, el("i", {}, cls === "err" ? "✕" : cls === "done" ? "✓" : "›"), el("span", {}, text)); $("#logBody").append(r); $("#logBody").scrollTop = 1e6; if (cls === "err") { $("#logSt").className = "st err"; $("#logTitle").textContent = "Analyse fehlgeschlagen"; } return r; }
function logDone(r, text) { r.className = "row done"; r.firstChild.textContent = "✓"; if (text) r.lastChild.textContent = text; }
function logFinish(text) { $("#logSt").className = "st ok"; $("#logTitle").textContent = text || "Analyse abgeschlossen"; logHide = setTimeout(() => { $("#log").dataset.open = "false"; }, 3800); }
$("#logClose").onclick = () => { $("#log").dataset.open = "false"; };
function toast(text) { logStart(text); $("#logBody").append(el("div", { class: "row done" }, el("i", {}, "✓"), el("span", {}, text))); logFinish(text); }

/* ============ Alles anzeigen ============ */
function show(data) {
  DATA = data; A = analyze(data); AI = null; SELECTED = null; tmRoot = ""; openDirs = new Set();
  MODE = "heur";
  panelX.set(1); panelEl.dataset.state = "closed";
  EXT.onShow.forEach(f => f());
  renderHeader();
  if (TAB !== "arch") switchTab("arch");
  requestAnimationFrame(() => { renderCanvas(); knobMode(false); knobDir(false); moveTabInd(false); });
}
$("#loadForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("#repoInput").value; if (!v.trim()) { $("#repoInput").focus(); return; }
  const b = $("#loadBtn"); b.disabled = true; b.classList.add("busy");
  try { const d = await loadGitHub(v); show(d); logFinish(`${d.repo} analysiert`); }
  catch (err) { if ($("#log").dataset.open !== "true") logStart(); logStep(err.message || String(err), "err"); }
  finally { b.disabled = false; b.classList.remove("busy"); }
});
$("#dirInput").addEventListener("change", async e => {
  try { const d = await loadLocal(e.target.files); show(d); logFinish(`»${d.repo}« analysiert`); } catch (err) { logStart(); logStep(err.message || String(err), "err"); }
  e.target.value = "";
});
$("#sampleBtn").onclick = () => { $("#log").dataset.open = "false"; show(SAMPLE); };

/* ============ Größe & Theme ============ */
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { moveTabInd(false); knobMode(false); knobDir(false); if (TAB === "tree") renderTreemap(); if (TAB === "arch") fitView(true); }, 120); });
if (document.fonts?.ready) document.fonts.ready.then(() => { moveTabInd(false); knobMode(false); knobDir(false); });

/* ============ Start ============ */
const SAMPLE = (() => { try { const s = JSON.parse(document.getElementById("sample-data").textContent); s.source = "sample"; s.description = "Verwandelt ein GitHub-Repository in ein interaktives Architekturdiagramm."; return s; } catch { return null; } })();
const qp = new URLSearchParams(location.search).get("repo");
if (qp) { $("#repoInput").value = qp; $("#loadForm").requestSubmit(); }
else if (SAMPLE) show(SAMPLE);

</script>
</body></html>
