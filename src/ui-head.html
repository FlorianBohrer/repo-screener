<title>Repo Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: drafting sheet – a plain header with breadcrumbs & tabs, below it a framed sheet with a fine grid,
   components as labeled boxes connected by ink lines, quiet floating panels and a detail panel that slides in from the right.
   Palette: cool drafting paper, black ink, one cobalt accent (blueprint ink). Type: Archivo for UI, IBM Plex Mono for data. */
:root{
  --bg:#e9ecef; --canvas:#f6f7f8; --grid:rgba(20,32,48,.055); --grid-2:rgba(20,32,48,.1);
  --surface:#ffffff; --surface-2:#f1f3f5; --raised:#ffffff; --hover:#e8ebee;
  --border:#bfc7cf; --border-2:#98a2ad;
  --glow-a:.32; --edge-mix:55%; --edge-mix-soft:38%;
  --text:#13171c; --text-2:#48525c; --text-3:#7a838d;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:rgba(29,78,216,.09); --ring:#1d4ed8;
  --edge:#98a1ab; --edge-hot:#1d4ed8;
  --ok:#1b7a48; --warn:#a36500; --bad:#bf3328;
  --c-frontend:#2c5fc4; --c-backend:#1d7752; --c-core:#6646b0; --c-infra:#b15418;
  --c-tests:#866a00; --c-docs:#636d77; --c-tooling:#9f346b; --c-config:#46525f; --c-external:#0d7680; --c-user:#13171c;
  --shadow:none;
  --shadow-lg:0 1px 2px rgba(20,32,48,.08),0 14px 30px -20px rgba(20,32,48,.45);
  --glass:var(--surface);
  --font:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:3px; --r:4px; --r-lg:6px;
  /* type scale: tracking tightens as size grows, leading loosens as size shrinks */
  --t-xl:20px; --t-lg:16px; --t-md:13.5px; --t-sm:12.5px; --t-xs:11px; --t-2xs:10px;
  --tr-xl:-.02em; --tr-lg:-.012em; --tr-md:0; --tr-sm:.003em; --tr-xs:.01em; --tr-caps:.09em;
  /* spacing grid: 4px steps */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --canvas:#191c20; --grid:rgba(255,255,255,.04); --grid-2:rgba(255,255,255,.075);
  --surface:#1e2125; --surface-2:#24282d; --raised:#22262b; --hover:#2a2f35;
  --border:#3d454e; --border-2:#59636e;
  --glow-a:.5; --edge-mix:62%; --edge-mix-soft:45%;
  --text:#e7e9ec; --text-2:#a5aeb8; --text-3:#76808a;
  --accent:#7ea1ff; --accent-ink:#0b1220; --accent-soft:rgba(126,161,255,.12); --ring:#7ea1ff;
  --edge:#5a636d; --edge-hot:#98b4ff;
  --ok:#4dbd7c; --warn:#dea33a; --bad:#ec6a5e;
  --c-frontend:#7ea1ff; --c-backend:#5ac293; --c-core:#a891ee; --c-infra:#e3985a;
  --c-tests:#d3b748; --c-docs:#98a1ab; --c-tooling:#df82b3; --c-config:#9aa6b6; --c-external:#4dc1cc; --c-user:#e7e9ec;
  --shadow-lg:0 1px 2px rgba(0,0,0,.4),0 16px 32px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141619; --canvas:#191c20; --grid:rgba(255,255,255,.04); --grid-2:rgba(255,255,255,.075);
  --surface:#1e2125; --surface-2:#24282d; --raised:#22262b; --hover:#2a2f35;
  --border:#3d454e; --border-2:#59636e;
  --glow-a:.5; --edge-mix:62%; --edge-mix-soft:45%;
  --text:#e7e9ec; --text-2:#a5aeb8; --text-3:#76808a;
  --accent:#7ea1ff; --accent-ink:#0b1220; --accent-soft:rgba(126,161,255,.12); --ring:#7ea1ff;
  --edge:#5a636d; --edge-hot:#98b4ff;
  --ok:#4dbd7c; --warn:#dea33a; --bad:#ec6a5e;
  --c-frontend:#7ea1ff; --c-backend:#5ac293; --c-core:#a891ee; --c-infra:#e3985a;
  --c-tests:#d3b748; --c-docs:#98a1ab; --c-tooling:#df82b3; --c-config:#9aa6b6; --c-external:#4dc1cc; --c-user:#e7e9ec;
  --shadow-lg:0 1px 2px rgba(0,0,0,.4),0 16px 32px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);transition:background-color .35s ease,color .35s ease}
body{font-family:var(--font);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 14px}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline;text-underline-offset:2px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);min-height:520px}

/* ===== Header ===== */
.top{position:relative;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s4);padding-block:var(--s3) 0}
.crumbs{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 280px}
.mark{width:26px;height:26px;border-radius:3px;flex:none;display:grid;place-items:center;background:var(--text);color:var(--bg)}
.mark svg{width:16px;height:16px}
.crumbs .sep{color:var(--text-3);font-size:18px;font-weight:300}
.crumbs .app-name{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.crumbs .proj{font-family:var(--mono);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.env{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--text-2);border:1px solid var(--border);background:var(--surface);padding:1px 7px 1px 6px;border-radius:3px;white-space:nowrap}
.env i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.tag-example{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;padding:0 5px;border-radius:2px;white-space:nowrap}

.actions{display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* Search field: grows on focus, rolling placeholder, suggestions as a combobox */
.cmd{position:relative;display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 11px;min-width:0;width:340px;max-width:100%;
  background:var(--surface);border:1px solid var(--border);border-radius:4px;isolation:isolate;z-index:5;
  transition:width .42s cubic-bezier(.32,.72,0,1),border-color .2s,box-shadow .3s,background-color .2s}
.cmd:hover{border-color:var(--border-2)}
.cmd:focus-within{width:440px;border-color:var(--accent);background:var(--raised);box-shadow:0 0 0 3px var(--accent-soft)}
.cmd-ico{position:relative;width:16px;height:16px;flex:none;display:grid;place-items:center}
.cmd-ico svg{width:15px;height:15px;color:var(--text-3);transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .2s,color .2s}
.cmd:focus-within .cmd-ico svg{color:var(--accent)}
.s-spin{position:absolute;inset:1px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.cmd[aria-busy="true"] .s-search{opacity:0;transform:scale(.4)}
.cmd[aria-busy="true"] .s-spin{opacity:1;transform:scale(1);animation:spin .7s linear infinite}
.cmd[aria-busy="true"]::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:30%;background:var(--accent);animation:scan 1.2s cubic-bezier(.65,0,.35,1) infinite alternate}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(233%)}}
.cmd-field{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:center}
.cmd input{width:100%;min-width:0;border:0;background:transparent;outline:none;font-size:13.5px;color:var(--text);caret-color:var(--accent)}
.cmd-ph{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-3);font-size:13.5px;white-space:nowrap;overflow:hidden;display:flex;gap:4px;transition:opacity .15s,transform .25s cubic-bezier(.32,.72,0,1)}
.ph-roll{position:relative;display:inline-block;height:1.3em;overflow:hidden;flex:1;min-width:0}
.ph-item{position:absolute;left:0;top:0;white-space:nowrap;color:var(--text-2);font-weight:500;transform:translateY(110%);opacity:0;transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .4s}
.ph-item.on{transform:none;opacity:1}
.ph-item.out{transform:translateY(-110%);opacity:0}
.cmd.has-value .cmd-ph{opacity:0;transform:translateY(-50%) translateX(6px)}
.detected{flex:none;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ok);border:1px solid currentColor;border-radius:2px;padding:0 6px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.cmd-clear{flex:none;width:22px;height:22px;border:0;border-radius:4px;background:none;color:var(--text-3);display:grid;place-items:center;cursor:pointer;animation:pop .25s cubic-bezier(.34,1.56,.64,1);transition:background-color .15s,color .15s}
.cmd-clear:hover{background:var(--hover);color:var(--text)}
.cmd-clear svg{width:12px;height:12px}
.cmd kbd{transition:opacity .2s,transform .25s}
.cmd:focus-within kbd,.cmd.has-value kbd{opacity:0;transform:scale(.8);width:0;padding:0;border-width:0;margin-left:-8px}
.cmd[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 12%,transparent)}
.cmd.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.cmd-msg{position:absolute;left:12px;top:calc(100% + 6px);font-size:12px;color:var(--bad);white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .25s}
.cmd-msg.show{opacity:1;transform:none}
.cmd-list{position:absolute;left:-1px;right:-1px;top:calc(100% + 8px);z-index:45;margin:0;padding:6px;list-style:none;border-radius:4px;background:var(--raised);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);
  max-height:320px;overflow:auto;transform-origin:top center;transition:opacity .18s,transform .3s cubic-bezier(.32,.72,0,1),visibility .3s}
.cmd-list[data-open="false"]{opacity:0;transform:translateY(-6px) scale(.98);visibility:hidden;pointer-events:none}
.cmd-list .grp-h{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:7px 9px 4px}
.cmd-list [role="option"]{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--text);animation:optIn .3s cubic-bezier(.32,.72,0,1) both}
.cmd-list [role="option"] svg{width:14px;height:14px;color:var(--text-3);flex:none}
.cmd-list [role="option"] .o-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-list [role="option"] .o-meta{font-size:11.5px;color:var(--text-3);flex:none}
.cmd-list [role="option"] mark{background:none;color:var(--accent);font-weight:600}
.cmd-list [role="option"][aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.cmd-list [role="option"][aria-selected="true"] svg{color:var(--accent)}
.cmd-list [role="option"][aria-selected="true"] .o-meta::after{content:" ↵";color:var(--accent)}
.cmd-list .o-empty{padding:9px;font-size:12.5px;color:var(--text-3)}
@keyframes optIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cmd.shake{animation:none}.ph-item{transition:none}}
kbd{font-family:var(--mono);font-size:11px;color:var(--text-3);border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;line-height:17px}
.btn{position:relative;height:34px;padding:0 13px;border-radius:4px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:7px;
  font-weight:500;font-size:13px;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s,transform .1s ease-out,box-shadow .2s}
.btn:hover{background:var(--hover);border-color:var(--border-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn.primary{border-color:var(--text);color:var(--bg);background:var(--text);font-weight:600}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:4px}
.btn.sm[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--ring);color:var(--text)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.busy::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabs{position:relative;display:flex;gap:2px;flex-basis:100%;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:none;padding:10px 12px 11px;color:var(--text-2);font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:color .15s}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text)}
.tab svg{width:15px;height:15px;opacity:.85}
.tab .count{font-family:var(--mono);font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.tab-ind{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--text);will-change:transform,width}

/* Token popover */
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:300px;padding:12px;border-radius:var(--r);background:var(--raised);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);
  transform-origin:top right;transition:opacity .18s var(--out),transform .22s var(--out)}
.pop[data-open="false"]{opacity:0;transform:scale(.96) translateY(-4px);pointer-events:none;visibility:hidden}
.pop label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
.pop input{width:100%;height:32px;border-radius:4px;border:1px solid var(--border);background:var(--surface-2);padding:0 10px;font-family:var(--mono);font-size:12px;outline:none}
.pop input:focus{border-color:var(--ring)}
.pop p{margin:8px 0 0;font-size:11.5px;color:var(--text-3)}
.anchor{position:relative}

/* ===== Workspace ===== */
.workspace{position:relative;margin-top:var(--s3);min-height:0;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--canvas);box-shadow:var(--shadow)}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
.view.enter{animation:viewIn .35s var(--out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.stage{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:linear-gradient(var(--grid-2) 1px,transparent 1px),linear-gradient(90deg,var(--grid-2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:-1px -1px}
.stage.dragging{cursor:grabbing}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible}
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-2);text-align:center;padding:24px}

/* Groups */
.grp{position:absolute;border:1px dashed var(--border-2);border-radius:4px;background:none;pointer-events:none;transition:opacity .25s}
.grp.loose{border-style:dotted;background:none}
.grp span{position:absolute;top:-8px;left:10px;padding:0 6px;background:var(--canvas);font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}

/* Service cards */
.card{position:absolute;width:212px;height:60px;padding:0 12px 0 10px;display:flex;align-items:center;gap:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  cursor:pointer;user-select:none;transition:border-color .2s,box-shadow .25s,opacity .25s,transform .2s var(--out)}
/* hover: the container lights up in its own color (cards: category, everything else: accent) */
.card,.box,.floating,.tile,.doc,.gflow,.lchip,.cmd-list,.pop,.chip{transition:border-color .18s ease-out,box-shadow .22s ease-out,background-color .15s,transform .1s ease-out,opacity .25s}
.card:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 0 4px color-mix(in srgb,var(--c) 14%,transparent),0 0 24px -4px color-mix(in srgb,var(--c) calc(var(--glow-a) * 100%),transparent)}
.card:active{transform:translateY(1px)}
.card .ico{width:30px;height:30px;border-radius:3px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent) inset}
.card .ico svg{width:16px;height:16px}
.card .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.card .nm{font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;line-height:1.2}
.card .pth{font-family:var(--mono);font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.card .cnt{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text-3);border-left:1px solid var(--border);padding:0 0 0 8px;line-height:18px}
.card.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c),var(--shadow-lg)}
.card.dim,.grp.dim{opacity:.32}
.card.ext{border-style:dashed;border-color:var(--border-2);background:var(--surface-2)}
.card.ext .pth{font-family:var(--font)}
.card.file{border-left:3px solid var(--c);padding-left:8px}
.card.file .ico{border-radius:4px}
.card.user{width:118px;height:40px;padding:0 14px 0 5px;border-radius:20px;gap:8px;border-color:var(--text-2)}
.card.chip{width:184px;height:34px;padding:0 8px 0 5px;gap:8px;border-radius:3px;box-shadow:none;background:var(--surface)}
.card.chip .ico{width:24px;height:24px;border-radius:4px}
.card.chip .ico svg{width:13px;height:13px}
.card.chip .nm{flex:1;font-size:12.5px;font-weight:500;color:var(--text-2)}
.card.chip .cnt{line-height:16px;font-size:10.5px}
.card.user .ico{width:32px;height:32px;border-radius:50%}

/* Edges */
.edge{fill:none;stroke:var(--edge);stroke-linecap:square;transition:stroke .25s,opacity .25s}
.flow{fill:none;stroke:var(--canvas);stroke-linecap:butt;stroke-dasharray:2 22;opacity:0;animation:flow 1.1s linear infinite;transition:opacity .25s}
.edge.soft{stroke-dasharray:4 4}
.edge.hot{stroke:var(--edge-hot)}
.flow.hot{opacity:1}
.edge.dim{opacity:.12}
.canvas.preview .edge.dim{opacity:.22}
.canvas.preview .card.dim,.canvas.preview .grp.dim{opacity:.5}
.edge.hover{stroke:var(--edge-hot);opacity:1}
.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.canvas.far .elabel:not(.hot){opacity:0}
.flow.dim{opacity:0}
@keyframes flow{to{stroke-dashoffset:-24}}
.elabel{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text-2);background:var(--canvas);border:0;border-radius:2px;padding:0 4px;line-height:15px;white-space:nowrap;pointer-events:none;transition:opacity .25s,color .25s,border-color .25s}
.elabel.hot{color:var(--edge-hot);font-weight:600}
.elabel.dim{opacity:.15}

/* HUD */
.hud{position:absolute;left:14px;right:14px;top:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.floating{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.summary{padding:12px 14px;max-width:420px;min-width:0}
.summary .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.summary h1{margin:var(--s1) 0 2px;font-size:var(--t-xl);font-weight:700;letter-spacing:var(--tr-xl);line-height:1.15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.summary h1 a{color:inherit}
.summary p{margin:0;color:var(--text-2);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.kpis{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.kpi b{display:block;font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:6px}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border)}
.seg button{position:relative;z-index:1;border:0;background:none;height:24px;padding:0 10px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:color .15s}
.seg button[aria-pressed="true"]{color:var(--text)}
.seg button:disabled{color:var(--text-3);cursor:not-allowed}
.seg button svg{width:13px;height:13px}
.seg .knob{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:2px;background:var(--raised);box-shadow:0 0 0 1px var(--border-2) inset;will-change:transform,width}
.overview{max-width:520px;padding:12px 14px;margin-top:0;font-size:13px}
.overview .who{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--accent)}
.overview p{margin:0}
.leftcol{display:flex;flex-direction:column;gap:10px;min-width:0;max-width:min(520px,100%)}

.zoom{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;padding:3px;z-index:5}
.zoom button{width:32px;height:32px;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--text-2);display:grid;place-items:center;transition:background-color .15s,color .15s}
.zoom button:hover{background:var(--hover);color:var(--text)}
.zoom button:active{transform:translateY(1px);background:var(--hover)}
.zoom button svg{width:15px;height:15px}
.zoom hr{border:0;height:1px;background:var(--border);margin:2px 4px}
.legend{position:absolute;left:60px;right:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none;z-index:4}
.legend span{pointer-events:auto;cursor:default;transition:border-color .15s;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);padding:3px 8px;border-radius:3px;background:var(--surface);border:1px solid var(--border)}
.legend i{width:8px;height:8px;border-radius:1px;background:var(--c)}

/* ===== Detail panel ===== */
.panel{position:absolute;top:10px;right:10px;bottom:10px;width:380px;max-width:calc(100% - 20px);z-index:20;display:flex;flex-direction:column;
  background:var(--raised);border:1px solid var(--border-2);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);transform:translateX(calc(100% + 24px));will-change:transform}
.panel[data-state="closed"]{visibility:hidden}
.panel .grab{position:absolute;left:0;top:0;bottom:0;width:14px;cursor:ew-resize;touch-action:none}
.panel .ph{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--border);cursor:grab;touch-action:none}
.panel .ph:active{cursor:grabbing}
.panel .ph .ico{width:36px;height:36px;border-radius:3px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent) inset}
.panel .ph .ico svg{width:19px;height:19px}
.panel .ph h2{margin:0;font-size:var(--t-lg);font-weight:700;letter-spacing:var(--tr-lg);line-height:1.2;overflow-wrap:anywhere}
.panel .ph .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pill{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:2px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.pill i{width:6px;height:6px;border-radius:1px;background:var(--c)}
.panel .pb{flex:1;overflow:auto;padding:var(--s4) var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s5)}
.panel .pb>*{animation:rise .4s var(--out) both;flex-shrink:0}
.panel .pb>*:nth-child(2){animation-delay:.03s}.panel .pb>*:nth-child(3){animation-delay:.06s}.panel .pb>*:nth-child(4){animation-delay:.09s}.panel .pb>*:nth-child(5){animation-delay:.12s}.panel .pb>*:nth-child(6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec h4{margin:0 0 7px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.fact{margin:0 0 var(--s2);font-size:var(--t-sm);line-height:1.55;color:var(--text-2)}
.fact b{color:var(--text);font-weight:600}
.fact.state{display:flex;gap:8px;align-items:baseline;color:var(--text)}
.fact.state i{flex:none;width:8px;height:8px;border-radius:50%;transform:translateY(-1px)}
.fact.state.ok i{background:var(--ok)} .fact.state.warn i{background:var(--warn)} .fact.state.bad i{background:var(--bad)}
.coup{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s2)}
.coup b{display:block;font-family:var(--mono);font-size:18px;font-weight:500}
.coup span{font-size:11.5px;color:var(--text-3)}
.scale{display:flex;align-items:center;gap:8px;margin-bottom:var(--s2)}
.scale .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.scale .track{position:relative;flex:1;height:4px;background:linear-gradient(90deg,var(--text-2),var(--border))}
.scale .track i{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--surface);border:2px solid var(--c);border-radius:50%}
.gflow.compact{margin-bottom:0}
.chip small{color:var(--text-3);font-size:10px}
.tile{padding:9px 10px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border)}
.tile b{display:block;font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--text-3)}
.desc{margin:0;color:var(--text-2);font-size:var(--t-sm);letter-spacing:var(--tr-sm);line-height:1.6}
.pathbox{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.pathbox svg{width:14px;height:14px;flex:none;color:var(--text-3)}
.minibar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin-bottom:7px}
.minibar i{height:100%}
.rows{display:flex;flex-direction:column}
.rows .r{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:0 -8px;border-radius:4px;font-size:12.5px;min-width:0}
.rows .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rows .r .v{margin-left:auto;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none}
.rows .r .d{width:7px;height:7px;border-radius:50%;flex:none}
.rows button.r{border:0;background:none;text-align:left;cursor:pointer;width:calc(100% + 16px);transition:background-color .15s,transform .1s ease-out}
.rows button.r:active{background:var(--hover);transform:translateY(1px)}
.rows button.r:hover{background:var(--hover)}
.rows button.r .ar{color:var(--text-3);transition:transform .2s var(--out)}
.rows button.r:hover .ar{transform:translateX(3px);color:var(--accent)}
.rows .r.f{font-family:var(--mono);font-size:11.5px}
.empty-note{font-size:12.5px;color:var(--text-3)}
.close{width:32px;height:32px;margin:-4px -6px 0 0;border-radius:4px;border:0;background:none;color:var(--text-2);cursor:pointer;display:grid;place-items:center;flex:none;transition:background-color .15s}
.close:hover{background:var(--hover);color:var(--text)}
.close svg{width:15px;height:15px}

/* ===== Guide ===== */
.explain{margin-top:10px;display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer}
.explain svg{width:14px;height:14px}
.explain .ar{transition:transform .2s var(--out)}
.explain:hover .ar{transform:translateX(3px)}
.g-sum p{margin:0 0 var(--s2);color:var(--text);font-size:var(--t-sm);letter-spacing:var(--tr-sm);line-height:1.6}
.g-sum p:first-child{font-size:15px;font-weight:600;letter-spacing:-.006em;line-height:1.4}
.tourbtn{width:100%;justify-content:center}
.gflow:active{transform:translateY(1px);background:var(--hover)}
.gflow{transition:transform .1s ease-out,border-color .15s,background-color .15s;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:4px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background-color .15s}
.gflow:hover{border-color:var(--accent);background:var(--hover)}
.gflow .fh{font-weight:600;font-size:12.5px}
.gflow .fx{font-size:12px;color:var(--text-2)}
.fp{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.fp .fn{font-size:11px;font-weight:500;padding:0 6px;border-radius:2px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap}
.fp .arr,.rel .arr{color:var(--text-3);font-size:11px}
.layer{padding:9px 0;border-top:1px solid var(--border)}
.layer:first-of-type{border-top:0;padding-top:0}
.layer .lh{display:flex;justify-content:space-between;font-size:12.5px}
.layer p{margin:2px 0 7px;font-size:12px;color:var(--text-2)}
.lchips{display:flex;flex-wrap:wrap;gap:5px}
.lchip:active{transform:translateY(1px);background:var(--hover)}
.lchip{transition:transform .1s ease-out,border-color .15s;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface-2);border-radius:3px;padding:2px 9px 2px 7px;font-size:11.5px;cursor:pointer;transition:border-color .15s}
.lchip:hover{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent),0 0 14px -4px color-mix(in srgb,var(--c) calc(var(--glow-a) * 100%),transparent)}
.lchip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
ol.start{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:9px;font-size:12.5px}
ol.start li::marker{color:var(--text-3);font-variant-numeric:tabular-nums}
ol.start .sname{border:0;background:none;padding:0;font-weight:600;color:var(--text);cursor:pointer;display:block}
ol.start .sname:hover{color:var(--accent)}
ol.start .spath{display:block;font-size:11px;overflow-wrap:anywhere}
ol.start .swhy{display:block;color:var(--text-2);font-size:12px}
.doc{border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:8px;background:var(--surface-2);font-size:12.5px}
.doc .dh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.doc .dh a{display:inline-flex;gap:4px;align-items:center;font-size:11.5px}
.doc .dh svg{width:11px;height:11px}
.doc p{margin:0 0 7px;color:var(--text-2)}
ul.md{margin:0 0 7px;padding-left:18px;color:var(--text-2)}
.rels{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--border-2)}
.rels>.muted{font-size:11px;margin-bottom:2px}
.rel{display:flex;flex-wrap:wrap;gap:5px;align-items:baseline;font-size:12px}
.rel span:not(.arr){font-weight:500}
.rel em{font-style:normal;color:var(--text-3);font-size:11.5px}
.rel.dotted .arr{opacity:.6}
.desc.role{color:var(--text);font-size:13px;line-height:1.55}
.desc.role.big{font-size:14px}
.quote{margin:0;padding:6px 0 6px 12px;border-left:2px solid var(--c);background:none;border-radius:0;font-size:12.5px;color:var(--text-2)}
.quote cite{display:block;margin-top:4px;font-style:normal;font-size:11px;color:var(--text-3)}
.chip.mono{font-family:var(--mono);font-size:11px}
.backlink{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots .dot{width:22px;height:4px;border-radius:0;border:0;padding:0;background:var(--border-2);cursor:pointer;transition:background-color .2s,width .25s var(--out)}
.dots .dot.done{background:var(--text-2)}
.dots .dot.on{background:var(--text);width:34px}
.tournav{display:flex;gap:8px;justify-content:space-between}
.tournav .btn.primary{margin-left:auto}
.ghostlink{background:none;border-color:transparent}

.box:hover,.floating:hover,.tile:hover,.doc:hover,.gflow:hover,.panel .chip:hover,.box .chip:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft),0 0 22px -6px color-mix(in srgb,var(--accent) calc(var(--glow-a) * 100%),transparent)}
.card.sel{box-shadow:0 0 0 1px var(--c),0 0 0 5px color-mix(in srgb,var(--c) 18%,transparent),0 0 28px -4px color-mix(in srgb,var(--c) calc(var(--glow-a) * 100%),transparent)}
.card.dim:hover{opacity:.8}

/* ===== Treemap ===== */
.subbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.subbar .sp{flex:1}
.hint{font-size:12px;color:var(--text-3)}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}
.crumb button{border:0;background:none;color:var(--text-2);cursor:pointer;padding:3px 8px;border-radius:4px;transition:background-color .15s}
.crumb button:hover{background:var(--hover);color:var(--text)}
.crumb button:last-child{color:var(--text);background:var(--surface-2);box-shadow:0 0 0 1px var(--border) inset;font-weight:500}
.crumb .s{color:var(--text-3)}
.tm{position:relative;flex:1;min-height:0;margin:10px}
.tm .t{position:absolute;overflow:hidden;font-size:10.5px;line-height:1.25;padding:3px 6px;border-radius:1px;font-family:var(--font);transition:filter .15s}
.tm .t.dir{background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--text-3);font-weight:600;cursor:zoom-in;box-shadow:0 0 0 1px var(--border) inset;letter-spacing:.01em}
.tm .t.dir:hover{color:var(--text);box-shadow:0 0 0 1px var(--border-2) inset}
.tm .t.leaf{cursor:pointer}
.tm .t.leaf:hover{filter:brightness(1.15);z-index:2}
.tip{position:fixed;z-index:60;pointer-events:none;max-width:360px;padding:7px 10px;border-radius:4px;font-family:var(--mono);font-size:11.5px;white-space:pre;
  background:var(--raised);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);color:var(--text)}

.tm .t.fold{cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:6px 7px;font-size:12px;line-height:1.2}
.tm .t .tn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .t .ts{font-family:var(--mono);font-size:10px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .t.leaf{display:flex;flex-direction:column;gap:2px}
.tm-list{display:none}
.crumb .up{font-weight:600}

/* ===== Files ===== */
.fbrowse .r{display:flex;align-items:center;width:100%;min-height:56px;margin:0;padding:8px 12px;gap:12px;border:0;border-bottom:1px solid var(--border);border-radius:0;background:none;text-align:left;color:var(--text);text-decoration:none;font:inherit;white-space:normal;cursor:pointer}
.fbrowse .r:hover{background:var(--hover)}
.fbrowse .r .fico{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.fbrowse .r .fico svg{width:15px;height:15px;color:var(--text-2)}
.fbrowse .r.d .fico svg{color:var(--accent)}
.fbrowse .r .fmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fbrowse .r .fname{font-size:14px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.fbrowse .r.d .fname{font-weight:600}
.fbrowse .r .fmeta{font-family:var(--mono);font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.fbrowse .r .fmeta .ld{width:7px;height:7px;border-radius:1px}
.fbrowse .r .fsize{font-family:var(--mono);font-size:11.5px;color:var(--text-2);flex:none}
.fbrowse .r .ar{color:var(--text-3);font-size:18px;line-height:1;flex:none}
.fbrowse .r:active{background:var(--hover)}
.fbrowse .fsum{padding:10px 12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border)}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:4px;border:1px solid var(--border);background:var(--surface);flex:1 1 240px;max-width:420px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--ring);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{width:14px;height:14px;color:var(--text-3)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:12.5px}
.files{flex:1;overflow:auto;padding:8px;font-size:12.5px}
.files .r{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:4px;white-space:nowrap;transition:background-color .12s}
.files .r:hover{background:var(--hover)}
.files .r.d{cursor:pointer}
.files .r .tw{width:12px;flex:none;color:var(--text-3);display:inline-block;transition:transform .2s var(--out)}
.files .r .tw.open{transform:rotate(90deg)}
.files .r svg{width:14px;height:14px;flex:none;color:var(--text-3)}
.files .r .nm{overflow:hidden;text-overflow:ellipsis}
.files .r .ct{font-size:11px;color:var(--text-3)}
.files .r .tst{font-size:10.5px;color:var(--c-tests);background:color-mix(in srgb,var(--c-tests) 14%,transparent);padding:0 6px;border-radius:4px}
.files .r .sz{margin-left:auto;padding-left:14px;color:var(--text-3);font-variant-numeric:tabular-nums}
.files .r .ld{width:7px;height:7px;border-radius:50%;flex:none}

/* ===== Screening ===== */
.health{flex:1;overflow:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;max-width:1280px;margin:0 auto}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;min-width:0;animation:rise .5s var(--out) both}
.box h3{margin:0 0 12px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);display:flex;justify-content:space-between;gap:8px}
.box h3 small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--text-3)}
.span4{grid-column:span 4}.span5{grid-column:span 5}.span7{grid-column:span 7}.span8{grid-column:span 8}.span6{grid-column:span 6}.span12{grid-column:span 12}
.scorebox{display:flex;align-items:center;gap:18px}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--text);stroke-linecap:butt}
.scorebox .big{font-family:var(--mono);font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.scorebox .big small{font-size:15px;color:var(--text-3);font-weight:500;letter-spacing:0}

.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}

.checks .st{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:700}
.checks .ok .st{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.checks .warn .st{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.checks .bad .st{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.checks .na .st{color:var(--text-3);background:var(--surface-2)}
.checks b{font-weight:600;font-size:13px}
.checks .why{grid-column:2;font-size:12px;color:var(--text-2);overflow-wrap:anywhere}
.langbar{display:flex;height:8px;border-radius:0;overflow:hidden;background:var(--surface-2);margin-bottom:12px;gap:1px}
.langbar i{height:100%;border-radius:0;transform-origin:left;animation:grow .8s var(--out) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:3px;border:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.notice{font-size:12.5px;padding:10px 12px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}

/* ===== Analysis log ===== */
.log{position:absolute;right:14px;bottom:14px;z-index:30;width:min(380px,calc(100% - 28px));border-radius:var(--r);background:var(--raised);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);overflow:hidden;
  transform-origin:bottom right;transition:opacity .25s var(--out),transform .35s var(--out)}
.log[data-open="false"]{opacity:0;transform:translateY(12px) scale(.97);pointer-events:none;visibility:hidden}
.log .lh{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600;font-size:12.5px}
.log .lh .st{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1s steps(2,start) infinite}
.log .lh .st.ok{background:var(--ok);animation:none}.log .lh .st.err{background:var(--bad);animation:none}

.log .lh .sp{flex:1}

  <symbol id="k-tests" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M6 1.8h4M6.7 1.8v4.4L2.6 12.8c-.6 1 .1 2 1.2 2h8.4c1.1 0 1.8-1 1.2-2L9.3 6.2V1.8M4.4 10h7.2"/></symbol>
  <symbol id="k-docs" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M2 3c2-.9 4-.9 6 .4 2-1.3 4-1.3 6-.4v10c-2-.9-4-.9-6 .4-2-1.3-4-1.3-6-.4zM8 3.4v10"/></symbol>
  <symbol id="k-tooling" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M10.2 2.2a3.5 3.5 0 0 0-3.8 4.6L2.2 11a1.4 1.4 0 0 0 2 2l4.2-4.2a3.5 3.5 0 0 0 4.6-3.8l-2 2-2-.6-.6-2z"/></symbol>
  <symbol id="k-external" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.8 1.9 2.6 3.9 2.6 6.2S9.8 12.3 8 14.2M8 1.8C6.2 3.7 5.4 5.7 5.4 8s.8 4.3 2.6 6.2"/></g></symbol>
  <symbol id="k-user" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.8 14c.6-2.8 2.7-4.4 5.2-4.4s4.6 1.6 5.2 4.4"/></g></symbol>

</svg>

<div class="app">
  <header class="top">
    <div class="crumbs">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1.8" y="2" width="5" height="4" rx="1.3"/><rect x="9.2" y="2" width="5" height="4" rx="1.3"/><rect x="5.5" y="10" width="5" height="4" rx="1.3"/><path d="M4.3 6v2h7.4V6M8 8v2"/></g></svg></span>
      <span class="app-name">Repo Screener</span>
      <span class="sep first">/</span>
      <span class="proj" id="repoName">–</span>
      <span class="env" id="envPill"><i></i><span id="envTxt">main</span></span>
      <span class="m-tools m-only">
        <button class="btn icon" type="button" id="mSearchBtn" aria-label="Search a repository" aria-expanded="false" aria-controls="loadForm"><svg><use href="#i-search"/></svg></button>
        <span class="anchor">
          <button class="btn icon" type="button" id="mMenuBtn" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" aria-controls="mMenu"><svg><use href="#i-more"/></svg></button>
          <span class="pop mmenu" id="mMenu" role="menu" data-open="false" aria-label="More actions">
            <button type="button" role="menuitem" id="mFolder"><svg><use href="#i-folder"/></svg>Analyze a local folder</button>
            <button type="button" role="menuitem" id="mExample"><svg><use href="#i-repo"/></svg>Load the example</button>
            <button type="button" role="menuitem" id="mToken"><svg><use href="#i-key"/></svg>Token for private repos</button>
          </span>
        </span>
      </span>
    </div>
    <div class="actions">
      <form class="cmd" id="loadForm" role="search" autocomplete="off" novalidate>
        <label for="repoInput" class="sr-only">GitHub repository to analyze</label>
        <span class="cmd-ico" aria-hidden="true"><svg class="s-search"><use href="#i-search"/></svg><span class="s-spin"></span></span>
        <span class="cmd-field">
          <input id="repoInput" type="text" inputmode="url" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="repoList" aria-describedby="repoHint repoMsg" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go">
          <span class="cmd-ph" id="repoPh" aria-hidden="true"><span class="ph-lead">Analyze</span> <span class="ph-roll"><span class="ph-item on">vercel/next.js</span></span></span>
        </span>
        <span class="detected" id="repoDetected" aria-hidden="true" hidden></span>
        <button type="button" class="cmd-clear" id="repoClear" aria-label="Clear search" hidden><svg><use href="#i-x"/></svg></button>
        <kbd id="kbdHint" aria-hidden="true" title="Press / to search">/</kbd>
        <span class="sr-only" id="repoHint">Enter owner/repo or a GitHub URL. Use the arrow keys to pick a suggestion, Enter to analyze, Escape to close.</span>
        <span class="cmd-msg" id="repoMsg" role="status" aria-live="polite"></span>
        <ul class="cmd-list" id="repoList" role="listbox" aria-label="Repository suggestions" data-open="false"></ul>
      </form>
      <button class="btn primary" type="submit" form="loadForm" id="loadBtn">Analyze</button>
      <div class="anchor">
        <button class="btn icon" type="button" id="tokenBtn" aria-label="GitHub token for private repos" aria-expanded="false"><svg><use href="#i-key"/></svg></button>
        <div class="pop" id="tokenPop" data-open="false">
          <label for="tokenInput">GitHub token for private repos</label>
          <input id="tokenInput" type="password" placeholder="ghp_…" autocomplete="off">
          <p>Kept in this tab’s memory only.</p>
        </div>
      </div>
      <label class="btn" for="dirInput" title="Analyze a local project folder – files never leave your browser"><svg><use href="#i-folder"/></svg>Folder</label>
      <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
      <button class="btn" type="button" id="sampleBtn">Example</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="View">
      <button class="tab" role="tab" aria-selected="true" data-tab="arch" id="tab-arch"><svg><use href="#i-arch"/></svg>Architecture <span class="count" id="bArch"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="tree" id="tab-tree"><svg><use href="#i-tree"/></svg>Treemap</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="files" id="tab-files"><svg><use href="#i-files"/></svg>Files <span class="count" id="bFiles"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="health" id="tab-health"><svg><use href="#i-pulse"/></svg>Screening <span class="count" id="bScore"></span></button>
      <span class="tab-ind" id="tabInd"></span>
    </nav>
  </header>

  <main class="workspace" id="workspace">
    <section class="view" data-view="arch">
      <div class="stage" id="stage">
        <div class="canvas" id="canvas"><svg id="edges"></svg><div id="nodes"></div></div>
        <div class="stage-empty" id="stageEmpty" hidden></div>
      </div>
      <div class="hud">
        <div class="leftcol">
          <div class="summary floating" id="summary">
            <button class="sum-toggle m-only" type="button" id="sumToggle" aria-expanded="false" aria-controls="summary" aria-label="Show project details"><svg><use href="#i-chev"/></svg></button>
            <div class="eyebrow" id="srcLabel">Source</div>
            <h1 id="repoTitle">–</h1>
            <p id="repoDesc"></p>
            <div class="kpis" id="kpis"></div>
            <button class="explain" type="button" id="explainBtn"><svg><use href="#i-book"/></svg>Explain this architecture<span class="ar">→</span></button>
          </div>
          <div class="overview floating" id="overview" hidden></div>
        </div>
        <div class="controls floating">
          <button class="btn sm" type="button" id="guideBtn" title="Architecture guide"><svg><use href="#i-book"/></svg><span>Guide</span></button>
          <button class="btn sm m-only" type="button" id="viewBtn" aria-expanded="false" aria-controls="viewMenu"><svg><use href="#i-sliders"/></svg><span>View</span></button>
          <div class="ctl-more" id="viewMenu">
          <div class="seg" role="group" aria-label="Direction" id="segDir"><span class="knob"></span>
            <button type="button" id="dirAuto" aria-pressed="true" aria-label="Automatic direction">Auto <span>↓</span></button>
            <button type="button" id="dirTD" aria-pressed="false" aria-label="Top to bottom"><svg><use href="#i-down"/></svg></button>
            <button type="button" id="dirLR" aria-pressed="false" aria-label="Left to right"><svg><use href="#i-right"/></svg></button>
          </div>
          <button class="btn sm" type="button" id="sideBtn" aria-pressed="false" hidden><svg><use href="#k-tooling"/></svg><span>Tooling &amp; Tests</span></button>
          <button class="btn sm icon" type="button" id="copyMm" title="Copy Mermaid source" aria-label="Copy Mermaid source"><svg><use href="#i-copy"/></svg></button>
          </div>
        </div>
      </div>
      <div class="zoom floating" role="group" aria-label="Zoom">
        <button type="button" id="zIn" aria-label="Zoom in (+)" title="Zoom in (+)"><svg><use href="#i-plus"/></svg></button>
        <button type="button" id="zOut" aria-label="Zoom out (−)" title="Zoom out (−)"><svg><use href="#i-minus"/></svg></button>
        <hr>
        <button type="button" id="zFit" aria-label="Fit to screen (F)" title="Fit to screen (F)"><svg><use href="#i-fit"/></svg></button>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="view" data-view="tree" hidden>
      <div class="subbar"><div class="crumb" id="tmCrumbs"></div><span class="sp"></span><span class="hint">Area = file size · color = language · click a folder to zoom in</span></div>
      <div class="tm" id="tm"></div>
      <div class="tm-list" id="tmList" role="list" aria-label="Contents of this folder" hidden></div>
    </section>

    <section class="view" data-view="files" hidden>
      <div class="subbar fbar"><label class="search" for="fileSearch"><svg><use href="#i-search"/></svg><input id="fileSearch" type="search" placeholder="Filter paths, e.g. api/ or .test." spellcheck="false" aria-label="Filter files"></label>
        <div class="seg" role="group" aria-label="Sort files" id="fileSort"><span class="knob"></span><button type="button" data-sort="name" aria-pressed="true">Name</button><button type="button" data-sort="size" aria-pressed="false">Size</button></div>
        <span class="sp"></span><span class="hint" id="fileCount"></span></div>
      <div class="crumb fcrumb" id="fileCrumbs" hidden></div>
      <div class="files" id="files" role="list"></div>
    </section>

    <section class="view" data-view="health" hidden>
      <div class="health"><div class="grid" id="healthGrid"></div></div>
    </section>

    <aside class="panel" id="panel" data-state="closed" aria-label="Component details">
      <div class="ph" id="panelHead"></div>
      <div class="pb" id="panelBody"></div>
    </aside>

    <div class="log" id="log" data-open="false" role="status" aria-live="polite">
      <div class="lh"><span class="st" id="logSt"></span><span id="logTitle">Analysis</span><span class="sp"></span><button class="close" type="button" id="logClose" aria-label="Close log"><svg><use href="#i-x"/></svg></button></div>
      <div class="lb" id="logBody"></div>
    </div>
  </main>
</div>
<div class="tip" id="tip" hidden></div>
